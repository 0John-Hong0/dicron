name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Create a new release or retry the current unfinished release"
        required: true
        default: new
        type: choice
        options:
          - new
          - retry

      bump_type:
        description: "Semantic version increment (ignored when retrying)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: dicron
  BINARY_NAME: dicron
  WINDOWS_INSTALLER_PREFIX: DicronSetup

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # ------------------------------------------------------------
      # NEW RELEASE
      # ------------------------------------------------------------

      - name: Bump package version
        if: ${{ inputs.release_mode == 'new' }}
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          bump_type = os.environ["BUMP_TYPE"]

          if bump_type not in {"patch", "minor", "major"}:
              raise SystemExit(f"Unsupported bump type: {bump_type}")

          cargo_toml_path = Path("Cargo.toml")
          cargo_toml_text = cargo_toml_path.read_text()
          cargo_config = tomllib.loads(cargo_toml_text)

          current_version = cargo_config["package"]["version"]

          try:
              major, minor, patch = (
                  int(part) for part in current_version.split(".")
              )
          except ValueError as error:
              raise SystemExit(
                  f"Unsupported version format: {current_version}"
              ) from error

          if bump_type == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump_type == "minor":
              minor += 1
              patch = 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"

          cargo_toml_text, replacements = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
              rf"\g<1>{new_version}\g<2>",
              cargo_toml_text,
              count=1,
          )

          if replacements != 1:
              raise SystemExit(
                  "Could not update package version in Cargo.toml"
              )

          cargo_toml_path.write_text(cargo_toml_text)

          cargo_lock_path = Path("Cargo.lock")
          cargo_lock_text = cargo_lock_path.read_text()

          cargo_lock_text, replacements = re.subn(
              r'(?ms)(\[\[package\]\]\n'
              r'name = "dicron"\n'
              r'version = ")[^"]+("\n)',
              rf"\g<1>{new_version}\g<2>",
              cargo_lock_text,
              count=1,
          )

          if replacements != 1:
              raise SystemExit(
                  "Could not update dicron package version in Cargo.lock"
              )

          cargo_lock_path.write_text(cargo_lock_text)

          print(f"Bumped version: {current_version} -> {new_version}")
          PY

      # ------------------------------------------------------------
      # BOTH NEW + RETRY
      # ------------------------------------------------------------

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as cargo_file:
              cargo_config = tomllib.load(cargo_file)

          print(cargo_config["package"]["version"])
          PY
          )"

          TAG_NAME="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG_NAME}"

      # ------------------------------------------------------------
      # NEW RELEASE
      # ------------------------------------------------------------

      - name: Validate new version does not already exist
        if: ${{ inputs.release_mode == 'new' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG_NAME already exists."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG_NAME already exists."
            exit 1
          fi

      - name: Promote changelog entry
        if: ${{ inputs.release_mode == 'new' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          export RELEASE_DATE

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          lines = changelog_path.read_text().splitlines()

          version = os.environ["RELEASE_VERSION"]
          release_date = os.environ["RELEASE_DATE"]

          unreleased_index = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == "## [Unreleased]"
              ),
              None,
          )

          if unreleased_index is None:
              raise SystemExit(
                  "CHANGELOG.md does not contain an [Unreleased] section."
              )

          next_section_index = next(
              (
                  index
                  for index in range(unreleased_index + 1, len(lines))
                  if lines[index].startswith("## ")
              ),
              len(lines),
          )

          unreleased_body = "\n".join(
              lines[unreleased_index + 1:next_section_index]
          ).strip()

          if not unreleased_body:
              raise SystemExit(
                  "CHANGELOG.md has no entries under [Unreleased]."
              )

          version_pattern = re.compile(
              rf"^## \[{re.escape(version)}\](?: |$)"
          )

          if any(version_pattern.match(line) for line in lines):
              raise SystemExit(
                  f"CHANGELOG.md already contains version [{version}]."
              )

          updated_lines = (
              lines[:unreleased_index + 1]
              + [
                  "",
                  f"## [{version}] - {release_date}",
              ]
              + lines[unreleased_index + 1:]
          )

          changelog_path.write_text(
              "\n".join(updated_lines) + "\n"
          )

          print(
              f"Promoted [Unreleased] to [{version}] - {release_date}"
          )
          PY

      # ------------------------------------------------------------
      # BOTH NEW + RETRY
      #
      # Generates notes from the actual version section in CHANGELOG.
      # For new releases that section was created immediately above.
      # For retries it already exists from the original release attempt.
      # ------------------------------------------------------------

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          lines = changelog_path.read_text().splitlines()

          version = os.environ["RELEASE_VERSION"]

          version_pattern = re.compile(
              rf"^## \[{re.escape(version)}\](?: |$)"
          )

          version_index = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if version_pattern.match(line)
              ),
              None,
          )

          if version_index is None:
              raise SystemExit(
                  f"CHANGELOG.md does not contain release [{version}]."
              )

          section_end = next(
              (
                  index
                  for index in range(version_index + 1, len(lines))
                  if lines[index].startswith("## ")
              ),
              len(lines),
          )

          release_notes = "\n".join(
              lines[version_index + 1:section_end]
          ).strip()

          if not release_notes:
              raise SystemExit(
                  f"CHANGELOG.md release [{version}] has no entries."
              )

          Path("release-notes.md").write_text(
              "## What's Changed\n\n"
              + release_notes
              + "\n"
          )

          print(f"Generated release notes for {version}")
          PY

      # ------------------------------------------------------------
      # NEW RELEASE
      # ------------------------------------------------------------

      - name: Commit release preparation
        if: ${{ inputs.release_mode == 'new' }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock CHANGELOG.md

          if git diff --cached --quiet; then
            echo "ERROR: No release preparation changes found."
            exit 1
          fi

          git commit -m "Prepare release $TAG_NAME"
          git push origin HEAD:main

      - name: Create and push tag
        if: ${{ inputs.release_mode == 'new' }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create draft GitHub release
        if: ${{ inputs.release_mode == 'new' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          gh release create "$TAG_NAME" \
            --verify-tag \
            --draft \
            --title "$TAG_NAME" \
            --notes-file release-notes.md

      # ------------------------------------------------------------
      # RETRY
      # ------------------------------------------------------------

      - name: Validate retry release
        if: ${{ inputs.release_mode == 'retry' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          echo "Retrying release: $TAG_NAME"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG_NAME does not exist."
            echo "A retry requires an existing release tag."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(
              gh release view "$TAG_NAME" \
                --json isDraft \
                --jq '.isDraft'
            )"

            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "ERROR: Release $TAG_NAME is already published."
              echo "Only draft releases can be retried."
              exit 1
            fi

            echo "Existing draft release found."
          else
            echo "Draft release is missing."
            echo "Recreating draft release from the existing tag."

            gh release create "$TAG_NAME" \
              --verify-tag \
              --draft \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          fi

  # ==============================================================
  # DEBIAN
  # ==============================================================

  build-deb:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            dpkg-dev \
            cmake \
            clang \
            curl \
            unzip \
            libssl-dev \
            libgtk-3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Fetch fonts
        run: bash scripts/fetch-fonts.sh

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build deb
        run: cargo deb

      - name: Upload deb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload \
            "${{ needs.prepare-release.outputs.tag_name }}" \
            target/debian/*.deb \
            --clobber

  # ==============================================================
  # ARCH
  # ==============================================================

  build-arch:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Build Arch package
        run: |
          RELEASE_VERSION="${{ needs.prepare-release.outputs.version }}"

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            -v "$PWD:/work" \
            archlinux:latest \
            bash -lc '
              set -euo pipefail

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                git \
                rust \
                cargo \
                pkgconf \
                cmake \
                clang \
                curl \
                unzip \
                gtk3 \
                fontconfig \
                freetype2 \
                libx11 \
                libxi \
                libxcursor \
                libxrandr \
                libxinerama \
                mesa \
                wayland \
                libxkbcommon \
                zstd

              groupadd -g "$HOST_GID" builder
              useradd -m -u "$HOST_UID" -g "$HOST_GID" builder

              chown -R "$HOST_UID:$HOST_GID" /work

              su builder -c "
                cd /work/packaging/arch &&
                sed -i \"s/^pkgver=.*/pkgver=$RELEASE_VERSION/\" PKGBUILD &&
                makepkg -sf --noconfirm
              "
            '

      - name: Upload Arch package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PACKAGE_FILE="$(
            find packaging/arch \
              -maxdepth 1 \
              -type f \
              -name "${PACKAGE_NAME}-*.pkg.tar.zst" \
              ! -name "${PACKAGE_NAME}-debug-*.pkg.tar.zst" \
              | head -n 1
          )"

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "ERROR: Arch package not found."
            exit 1
          fi

          echo "Uploading: $PACKAGE_FILE"

          gh release upload \
            "${{ needs.prepare-release.outputs.tag_name }}" \
            "$PACKAGE_FILE" \
            --clobber

  # ==============================================================
  # WINDOWS
  # ==============================================================

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Install Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Fetch fonts
        shell: bash
        run: bash scripts/fetch-fonts.sh

      - name: Build Windows exe
        shell: pwsh
        run: cargo build --release --locked

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $appVersion = "${{ needs.prepare-release.outputs.version }}"

          Remove-Item `
            -Recurse `
            -Force `
            "dist/windows/app" `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            "dist/windows/app"

          Write-Host "Checking target/release..."
          Get-ChildItem "target/release"

          $exePath = Get-ChildItem `
            "target/release" `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exePath) {
            throw "No Windows exe found in target/release"
          }

          Write-Host "Using exe: $($exePath.FullName)"

          Copy-Item `
            $exePath.FullName `
            "dist/windows/app/dicron.exe"

          if (Test-Path "assets/licenses") {
            New-Item `
              -ItemType Directory `
              -Force `
              "dist/windows/app/licenses"

            Copy-Item `
              "assets/licenses/*" `
              "dist/windows/app/licenses/"
          }

          Write-Host "Checking dist/windows/app..."
          Get-ChildItem "dist/windows/app" -Recurse

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DAPP_VERSION=$appVersion" `
            "packaging/windows/dicron.nsi"

      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $appVersion = "${{ needs.prepare-release.outputs.version }}"

          gh release upload `
            "${{ needs.prepare-release.outputs.tag_name }}" `
            "dist/${env:WINDOWS_INSTALLER_PREFIX}-$appVersion.exe" `
            --clobber

  # ==============================================================
  # PUBLISH
  #
  # This job is only reached when ALL package jobs succeeded.
  # ==============================================================

  publish-release:
    needs:
      - prepare-release
      - build-deb
      - build-arch
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${{ needs.prepare-release.outputs.tag_name }}"

          echo "All release builds succeeded."
          echo "Publishing $TAG_NAME..."

          gh release edit "$TAG_NAME" --draft=false

          echo "Published $TAG_NAME."
